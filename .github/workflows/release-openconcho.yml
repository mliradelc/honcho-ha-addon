name: Build and publish OpenConcho add-on image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (from openconcho/config.yaml)'
        required: true
        default: '1.0.0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/openconcho
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  pre-flight:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate config.yaml syntax
        run: python3 -c "import yaml; yaml.safe_load(open('openconcho/config.yaml'))"

      - name: Check run.sh shell syntax
        run: bash -n openconcho/run.sh && echo "run.sh syntax OK"

      - name: Enforce no runtime builds in run.sh
        run: |
          # OpenConcho SPA is built in CI (Dockerfile). run.sh must never build at runtime.
          if grep -Eq '(npm|pnpm|yarn|node|webpack|vite|tsc|build|corepack)' openconcho/run.sh; then
            echo "FAIL: openconcho/run.sh contains a build-time command."
            echo "The SPA must be built in CI (Dockerfile), not on the HA server."
            grep -En '(npm|pnpm|yarn|node|webpack|vite|tsc|build|corepack)' openconcho/run.sh
            exit 1
          fi
          echo "OK: no runtime build commands in run.sh"

      - name: Confirm image field is set in config.yaml
        run: |
          if ! grep -q '^image:' openconcho/config.yaml; then
            echo "FAIL: openconcho/config.yaml is missing the 'image:' field."
            echo "Without it, HA Supervisor will attempt a local Docker build."
            exit 1
          fi
          echo "OK: image field present — $(grep '^image:' openconcho/config.yaml)"

      - name: Confirm init:false is set in config.yaml
        run: |
          if ! grep -q '^init: false' openconcho/config.yaml; then
            echo "FAIL: openconcho/config.yaml is missing 'init: false'."
            echo "Without it, HA Supervisor runs its own init and clashes with s6-overlay (PID 1 error)."
            exit 1
          fi
          echo "OK: init: false present"

  build-and-push:
    name: Build (${{ matrix.arch }})
    needs: pre-flight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION="${{ github.event.release.tag_name || inputs.version }}"
          VERSION="${VERSION#openconcho-}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Determine base image for arch
        id: base
        run: |
          case "${{ matrix.arch }}" in
            amd64)   echo "base=ghcr.io/home-assistant/amd64-base-debian:bookworm" >> $GITHUB_OUTPUT ;;
            aarch64) echo "base=ghcr.io/home-assistant/aarch64-base-debian:bookworm" >> $GITHUB_OUTPUT ;;
          esac

      - name: Build and push per-arch image
        uses: docker/build-push-action@v6
        with:
          context: ./openconcho
          file: ./openconcho/Dockerfile
          push: true
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.base }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.arch }}
          provenance: false
          sbom: false

  create-manifest:
    name: Create multi-arch manifest
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          VERSION="${VERSION#openconcho-}"
          VERSION="${VERSION#v}"

          AMD64_DIGEST=$(docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-amd64 \
            --format '{{.Manifest.Digest}}')
          AARCH64_DIGEST=$(docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-aarch64 \
            --format '{{.Manifest.Digest}}')

          if [[ "$AMD64_DIGEST" != sha256:* ]] || [[ "$AARCH64_DIGEST" != sha256:* ]]; then
            echo "ERROR: unexpected digest format"; exit 1
          fi

          docker manifest create \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${AMD64_DIGEST} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${AARCH64_DIGEST}
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}

          docker manifest create \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${AMD64_DIGEST} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${AARCH64_DIGEST}
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
