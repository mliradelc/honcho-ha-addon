name: Build and publish add-on image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (from honcho/config.yaml)'
        required: true
        default: '3.0.7'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  pre-flight:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate config.yaml syntax
        run: python3 -c "import yaml; yaml.safe_load(open('honcho/config.yaml'))"

      - name: Check run.sh shell syntax
        run: bash -n honcho/run.sh && echo "run.sh syntax OK"

      - name: Check for duplicate nginx location blocks
        run: |
          COUNT=$(grep -c 'location /v3/' honcho/run.sh || true)
          echo "Found $COUNT location /v3/ block(s)"
          if [ "$COUNT" -gt 1 ]; then
            echo "FAIL: duplicate location /v3/ blocks in run.sh"
            exit 1
          fi
          echo "OK: no duplicate nginx location blocks"

      - name: Validate Dockerfile syntax
        run: |
          docker run --rm -i hadolint/hadolint hadolint \
            --ignore DL3008 --ignore DL3009 --ignore DL3015 \
            --ignore SC2015 --ignore DL4006 \
            - < honcho/Dockerfile && echo "Dockerfile OK" || true

  build-and-push:
    name: Build (${{ matrix.arch }})
    needs: pre-flight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION="${{ github.event.release.tag_name || inputs.version }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Determine base image for arch
        id: base
        run: |
          case "${{ matrix.arch }}" in
            amd64)   echo "base=ghcr.io/home-assistant/amd64-base-debian:bookworm" >> $GITHUB_OUTPUT ;;
            aarch64) echo "base=ghcr.io/home-assistant/aarch64-base-debian:bookworm" >> $GITHUB_OUTPUT ;;
          esac

      - name: Build and push per-arch image
        uses: docker/build-push-action@v6
        with:
          context: ./honcho
          file: ./honcho/Dockerfile
          push: true
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.base }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.arch }}
          provenance: false
          sbom: false

  create-manifest:
    name: Create multi-arch manifest
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          VERSION="${VERSION#v}"

          AMD64_DIGEST=$(docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-amd64 \
            --format '{{.Manifest.Digest}}')
          AARCH64_DIGEST=$(docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-aarch64 \
            --format '{{.Manifest.Digest}}')

          echo "AMD64:   $AMD64_DIGEST"
          echo "AARCH64: $AARCH64_DIGEST"

          if [[ "$AMD64_DIGEST" != sha256:* ]] || [[ "$AARCH64_DIGEST" != sha256:* ]]; then
            echo "ERROR: unexpected digest format — aborting"
            exit 1
          fi

          docker manifest create \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${AMD64_DIGEST} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${AARCH64_DIGEST}
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}

          docker manifest create \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${AMD64_DIGEST} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${AARCH64_DIGEST}
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
