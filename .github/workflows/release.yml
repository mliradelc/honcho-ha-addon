name: Build and publish add-on image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (from honcho/config.yaml)'
        required: true
        default: '3.0.7'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION="${{ github.event.release.tag_name || inputs.version }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Determine base image for arch
        id: base
        run: |
          case "${{ matrix.arch }}" in
            amd64)   echo "base=ghcr.io/home-assistant/amd64-base-debian:bookworm" >> $GITHUB_OUTPUT ;;
            aarch64) echo "base=ghcr.io/home-assistant/aarch64-base-debian:bookworm" >> $GITHUB_OUTPUT ;;
          esac

      - name: Build and push per-arch image
        uses: docker/build-push-action@v6
        with:
          context: ./honcho
          file: ./honcho/Dockerfile
          push: true
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.base }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.arch }}
          # Push single-arch images, not manifest lists
          provenance: false
          sbom: false

  create-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        id: manifest
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          VERSION="${VERSION#v}"

          # Each per-arch image is a single OCI manifest (provenance=false), so
          # use --format '{{.Manifest.Digest}}' which works for both single manifests
          # and manifest lists — unlike '{{json .}}.manifests[].digest' which only
          # works for manifest lists.
          AMD64_DIGEST=$(docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-amd64 \
            --format '{{.Manifest.Digest}}')

          AARCH64_DIGEST=$(docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-aarch64 \
            --format '{{.Manifest.Digest}}')

          echo "AMD64 digest:   $AMD64_DIGEST"
          echo "AARCH64 digest: $AARCH64_DIGEST"

          # Validate digests look correct before using them
          if [[ "$AMD64_DIGEST" != sha256:* ]] || [[ "$AARCH64_DIGEST" != sha256:* ]]; then
            echo "ERROR: Unexpected digest format — aborting manifest creation"
            exit 1
          fi

          # Create and push versioned multi-arch manifest
          docker manifest create \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${AMD64_DIGEST} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${AARCH64_DIGEST}
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}

          # Create and push latest multi-arch manifest
          docker manifest create \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${AMD64_DIGEST} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${AARCH64_DIGEST}
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          echo "Pushed multi-arch manifest: ${VERSION} and latest"
