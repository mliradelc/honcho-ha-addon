name: Secret Scan

# Runs on every push and pull request.
# If a secret is found, the job fails and the push/PR is flagged.
# This is a SECOND layer — GitHub's built-in push protection is the primary gate.
# This CI check makes secret detection visible in the PR/commit status.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for trufflehog

      - name: TruffleHog OSS — scan full history
        uses: trufflesecurity/trufflehog@v3
        with:
          path: ./
          base: ${{ github.event.before || github.base_ref || 'HEAD~1' }}
          head: HEAD
          extra_args: --only-verified --no-update

      - name: Gitleaks — scan current commit
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
