name: Upstream Watch

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday 06:00 UTC
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch latest Redis version
        id: redis
        run: |
          LATEST=$(curl -s https://api.github.com/repos/redis/redis/releases \
            | jq -r '[.[] | select(.prerelease==false)][0].tag_name')
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Fetch latest pgvector version
        id: pgvector
        run: |
          LATEST=$(curl -s https://api.github.com/repos/pgvector/pgvector/releases \
            | jq -r '[.[] | select(.prerelease==false)][0].tag_name')
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Compare with recorded versions
        run: |
          echo "=== Recorded versions ==="
          cat honcho/.upstream-versions.json
          echo ""
          echo "=== Latest upstream ==="
          echo "Redis:    ${{ steps.redis.outputs.version }}"
          echo "pgvector: ${{ steps.pgvector.outputs.version }}"
