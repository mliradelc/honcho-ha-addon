name: Validate add-on image

on:
  # Run after a successful build — Docker image is guaranteed to exist
  workflow_run:
    workflows: ["Build and publish add-on image"]
    types: [completed]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mliradelc/honcho-ha-addon
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate:
    name: Runtime smoke-test
    runs-on: ubuntu-latest
    # Only run when the build actually succeeded
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' honcho/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Testing version: $VERSION"

      - name: Prepare fake options.json
        run: |
          mkdir -p /tmp/honcho-test/data /tmp/honcho-test/config/honcho
          cat > /tmp/honcho-test/data/options.json << 'EOF'
          {
            "git_url": "https://github.com/plastic-labs/honcho.git",
            "git_ref": "",
            "git_token": "",
            "auto_update": false,
            "db_mode": "embedded",
            "db_url": "",
            "redis_mode": "embedded",
            "redis_url": "",
            "api_port": 8000,
            "access_password": "",
            "openconcho_enabled": true,
            "env_vars": []
          }
          EOF

      - name: Check required binaries are on PATH
        run: |
          docker run --rm \
            -v /tmp/honcho-test/data:/data:ro \
            -v /tmp/honcho-test/config:/config \
            --entrypoint bash \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -c '
              set -euo pipefail
              for cmd in initdb pg_ctl psql redis-server nginx uv git jq python3; do
                path=$(command -v "$cmd" 2>/dev/null || true)
                if [ -z "$path" ]; then echo "FAIL: $cmd not found"; exit 1; fi
                echo "  OK: $cmd -> $path"
              done
            '

      - name: Verify nginx config generation is valid
        run: |
          docker run --rm \
            -v /tmp/honcho-test/data:/data:ro \
            -v /tmp/honcho-test/config:/config \
            --entrypoint bash \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -c '
              set -euo pipefail
              mkdir -p /var/www/openconcho /var/log/nginx /run/nginx
              touch /var/www/openconcho/index.html
              printf "worker_processes auto;\npid /run/nginx.pid;\nevents { worker_connections 768; }\nhttp {\n    include /etc/nginx/mime.types;\n    default_type application/octet-stream;\n    server {\n        listen 49170 default_server;\n        root /var/www/openconcho;\n        index index.html;\n        location /api/ { proxy_pass http://127.0.0.1:8000/; }\n        location /v3/ { proxy_pass http://127.0.0.1:8000/v3/; }\n        location / { try_files \$uri \$uri/ /index.html; }\n    }\n}\n" > /etc/nginx/nginx.conf
              nginx -t 2>&1 && echo "OK: nginx config valid" || { echo "FAIL: nginx config invalid"; exit 1; }
            '

      - name: Check pgvector extension is installable
        run: |
          docker run --rm \
            -v /tmp/honcho-test/config:/config \
            --entrypoint bash \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -c '
              set -euo pipefail
              PG_SHAREDIR=$(pg_config --sharedir 2>/dev/null || echo /usr/share/postgresql/15)
              if ls ${PG_SHAREDIR}/extension/vector* >/dev/null 2>&1; then
                echo "OK: pgvector extension files found"
              else
                echo "FAIL: pgvector not found under $PG_SHAREDIR"; exit 1
              fi
            '

      - name: Verify initdb creates a cluster successfully
        run: |
          docker run --rm \
            -v /tmp/honcho-test/config:/config \
            --entrypoint bash \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -c '
              set -euo pipefail
              PGDATA=$(mktemp -d)
              chown postgres "$PGDATA"
              su -s /bin/bash postgres -c "initdb -D $PGDATA --username=postgres --auth=trust"
              echo "OK: initdb succeeded"
              rm -rf "$PGDATA"
            '
