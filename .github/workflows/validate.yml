name: Validate add-on image

on:
  # Trigger after the build workflow completes successfully on main
  workflow_run:
    workflows: ["Build and publish add-on image"]
    types: [completed]
  # Also allow manual runs and PR static checks (no Docker pull)
  pull_request:
    paths:
      - 'honcho/Dockerfile'
      - 'honcho/run.sh'
      - 'honcho/config.yaml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mliradelc/honcho-ha-addon

jobs:
  validate:
    name: Smoke-test add-on image
    runs-on: ubuntu-latest
    # When triggered by workflow_run, only run if the build succeeded
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      packages: read

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' honcho/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Testing version: $VERSION"

      # ── Static checks (no Docker) ──────────────────────────────────────────

      - name: Validate config.yaml syntax
        run: python3 -c "import yaml; yaml.safe_load(open('honcho/config.yaml'))"

      - name: Check run.sh syntax
        run: bash -n honcho/run.sh && echo "run.sh syntax OK"

      # ── Runtime checks inside the container ───────────────────────────────

      - name: Prepare fake options.json
        run: |
          mkdir -p /tmp/honcho-test/data /tmp/honcho-test/config/honcho
          cat > /tmp/honcho-test/data/options.json << 'EOF'
          {
            "git_url": "https://github.com/plastic-labs/honcho.git",
            "git_ref": "",
            "git_token": "",
            "auto_update": false,
            "db_mode": "embedded",
            "db_url": "",
            "redis_mode": "embedded",
            "redis_url": "",
            "api_port": 8000,
            "access_password": "",
            "env_vars": []
          }
          EOF

      - name: Check required binaries are on PATH
        run: |
          docker run --rm \
            -v /tmp/honcho-test/data:/data:ro \
            -v /tmp/honcho-test/config:/config \
            --entrypoint bash \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -c '
              set -euo pipefail
              echo "=== Binary presence check ==="
              for cmd in initdb pg_ctl psql redis-server nginx uv git jq python3; do
                path=$(command -v "$cmd" 2>/dev/null || true)
                if [ -z "$path" ]; then
                  echo "FAIL: $cmd not found on PATH"
                  exit 1
                fi
                echo "  OK: $cmd -> $path"
              done
              echo ""
              echo "=== Version summary ==="
              initdb --version
              redis-server --version | head -1
              nginx -v 2>&1 | head -1
              uv --version
              python3 --version
              git --version
            '

      - name: Check pgvector extension is installable
        run: |
          docker run --rm \
            -v /tmp/honcho-test/config:/config \
            --entrypoint bash \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -c '
              set -euo pipefail
              echo "=== pgvector availability ==="
              # Check the shared library and control file exist
              PG_SHAREDIR=$(pg_config --sharedir 2>/dev/null || echo /usr/share/postgresql/15)
              if ls ${PG_SHAREDIR}/extension/vector* >/dev/null 2>&1; then
                echo "  OK: pgvector extension files found"
                ls ${PG_SHAREDIR}/extension/vector*
              else
                echo "FAIL: pgvector extension files not found under $PG_SHAREDIR"
                exit 1
              fi
            '

      - name: Verify postgres user can write to logs directory
        run: |
          docker run --rm \
            -v /tmp/honcho-test/config:/config \
            --entrypoint bash \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -c '
              set -euo pipefail
              echo "=== Logs directory ownership check ==="
              HONCHO_HOME="/config/honcho"
              mkdir -p "$HONCHO_HOME/logs"
              chown postgres "$HONCHO_HOME"
              chown postgres "$HONCHO_HOME/logs"
              touch "$HONCHO_HOME/logs/postgres.log"
              chown postgres "$HONCHO_HOME/logs/postgres.log"
              # Verify postgres user can actually write to it
              su -s /bin/bash postgres -c "echo test > $HONCHO_HOME/logs/postgres.log"
              echo "  OK: postgres user can write to logs directory"
            '


      - name: Verify nginx config is valid
        run: |
          docker run --rm \
            -v /tmp/honcho-test/data:/data:ro \
            -v /tmp/honcho-test/config:/config \
            --entrypoint bash \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -c '
              set -euo pipefail
              echo "=== nginx config generation + test ==="
              # Source a minimal environment that matches what run.sh provides
              export OPENCONCHO_ENABLED=true
              export API_PORT=8000
              export ACCESS_PASSWORD=""
              # Run just the start_nginx function in isolation
              # by sourcing run.sh up to that point and calling nginx -t
              # Simpler: generate the config manually and test it
              mkdir -p /var/www/openconcho
              touch /var/www/openconcho/index.html
              cat > /etc/nginx/nginx.conf << NGINXEOF
worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 768; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server {
        listen 49170 default_server;
        root /var/www/openconcho;
        index index.html;
        location /api/ { proxy_pass http://127.0.0.1:8000/; }
        location /v3/  { proxy_pass http://127.0.0.1:8000/v3/; }
        location / { try_files \$uri \$uri/ /index.html; }
    }
}
NGINXEOF
              nginx -t 2>&1 && echo "  OK: nginx config valid" || { echo "FAIL: nginx config invalid"; exit 1; }
            '

      - name: Verify initdb creates a cluster successfully
        run: |
          docker run --rm \
            -v /tmp/honcho-test/config:/config \
            --entrypoint bash \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -c '
              set -euo pipefail
              echo "=== initdb smoke test ==="
              PGDATA=$(mktemp -d)
              chown postgres "$PGDATA"
              su -s /bin/bash postgres -c "initdb -D $PGDATA --username=postgres --auth=trust"
              echo "  OK: initdb succeeded — PG_VERSION=$(cat $PGDATA/PG_VERSION)"
              rm -rf "$PGDATA"
            '
