name: Validate add-on image

on:
  workflow_run:
    workflows: ["Build and publish add-on image"]
    types: [completed]
  pull_request:
    paths:
      - 'honcho/Dockerfile'
      - 'honcho/run.sh'
      - 'honcho/config.yaml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mliradelc/honcho-ha-addon

jobs:
  validate:
    name: Smoke-test add-on image
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      packages: read

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' honcho/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Testing version: $VERSION"

      # ── Static checks (no Docker) ──────────────────────────────────────────

      - name: Validate config.yaml syntax
        run: python3 -c "import yaml; yaml.safe_load(open('honcho/config.yaml'))"

      - name: Check run.sh syntax
        run: bash -n honcho/run.sh && echo "run.sh syntax OK"

      - name: Check for duplicate nginx location blocks in run.sh
        run: |
          COUNT=$(grep -c 'location /v3/' honcho/run.sh || true)
          echo "Found $COUNT /v3/ location block(s) in run.sh"
          if [ "$COUNT" -gt 1 ]; then
            echo "FAIL: duplicate location /v3/ blocks detected"
            exit 1
          fi
          echo "OK: no duplicate nginx location blocks"

      # ── Runtime checks inside the container ───────────────────────────────

      - name: Prepare fake options.json
        run: |
          mkdir -p /tmp/honcho-test/data /tmp/honcho-test/config/honcho
          cat > /tmp/honcho-test/data/options.json << 'EOF'
          {
            "git_url": "https://github.com/plastic-labs/honcho.git",
            "git_ref": "",
            "git_token": "",
            "auto_update": false,
            "db_mode": "embedded",
            "db_url": "",
            "redis_mode": "embedded",
            "redis_url": "",
            "api_port": 8000,
            "access_password": "",
            "openconcho_enabled": true,
            "env_vars": []
          }
          EOF

      - name: Check required binaries are on PATH
        run: |
          docker run --rm \
            -v /tmp/honcho-test/data:/data:ro \
            -v /tmp/honcho-test/config:/config \
            --entrypoint bash \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -c '
              set -euo pipefail
              echo "=== Binary presence check ==="
              for cmd in initdb pg_ctl psql redis-server nginx uv git jq python3; do
                path=$(command -v "$cmd" 2>/dev/null || true)
                if [ -z "$path" ]; then
                  echo "FAIL: $cmd not found on PATH"
                  exit 1
                fi
                echo "  OK: $cmd -> $path"
              done
            '

      - name: Verify nginx config generation is valid
        run: |
          docker run --rm \
            -v /tmp/honcho-test/data:/data:ro \
            -v /tmp/honcho-test/config:/config \
            --entrypoint bash \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -c '
              set -euo pipefail
              echo "=== nginx config generation + test ==="
              mkdir -p /var/www/openconcho /var/log/nginx /run/nginx
              touch /var/www/openconcho/index.html
              API_PORT=8000
              printf "worker_processes auto;\npid /run/nginx.pid;\nevents { worker_connections 768; }\nhttp {\n    include /etc/nginx/mime.types;\n    default_type application/octet-stream;\n    server {\n        listen 49170 default_server;\n        root /var/www/openconcho;\n        index index.html;\n        location /api/ { proxy_pass http://127.0.0.1:%s/; }\n        location /v3/  { proxy_pass http://127.0.0.1:%s/v3/; }\n        location / { try_files \$uri \$uri/ /index.html; }\n    }\n}\n" "$API_PORT" "$API_PORT" > /etc/nginx/nginx.conf
              nginx -t 2>&1 && echo "  OK: nginx config valid" || { echo "FAIL: nginx config invalid"; exit 1; }
            '

      - name: Check pgvector extension is installable
        run: |
          docker run --rm \
            -v /tmp/honcho-test/config:/config \
            --entrypoint bash \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -c '
              set -euo pipefail
              echo "=== pgvector availability ==="
              PG_SHAREDIR=$(pg_config --sharedir 2>/dev/null || echo /usr/share/postgresql/15)
              if ls ${PG_SHAREDIR}/extension/vector* >/dev/null 2>&1; then
                echo "  OK: pgvector extension files found"
              else
                echo "FAIL: pgvector extension files not found under $PG_SHAREDIR"
                exit 1
              fi
            '

      - name: Verify initdb creates a cluster successfully
        run: |
          docker run --rm \
            -v /tmp/honcho-test/config:/config \
            --entrypoint bash \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -c '
              set -euo pipefail
              echo "=== initdb smoke test ==="
              PGDATA=$(mktemp -d)
              chown postgres "$PGDATA"
              su -s /bin/bash postgres -c "initdb -D $PGDATA --username=postgres --auth=trust"
              echo "  OK: initdb succeeded"
              rm -rf "$PGDATA"
            '
