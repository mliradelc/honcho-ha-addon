name: Honcho
version: "3.0.7"
slug: honcho
description: "Honcho memory backend add-on for Home Assistant"
url: "https://github.com/plastic-labs/honcho"
image: ghcr.io/mliradelc/honcho-ha-addon
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 49170
panel_icon: mdi:memory
panel_title: Honcho
map:
  - addon_config:rw
ports:
  8000/tcp: null
ports_description:
  8000/tcp: "HTTP API for Honcho"
options:
  git_url: "https://github.com/plastic-labs/honcho.git"
  git_ref: ""
  git_token: ""
  auto_update: false
  db_mode: embedded
  db_url: ""
  redis_mode: embedded
  redis_url: ""
  api_port: 8000
  access_password: ""
  env_vars: []
schema:
  git_url: "url?"
  git_ref: "str?"
  git_token: "password?"
  auto_update: "bool"
  db_mode: "str?"
  db_url: "str?"
  redis_mode: "str?"
  redis_url: "str?"
  api_port: "int?"
  access_password: "password?"
  env_vars:
    - name: "match(^[A-Z_][A-Z0-9_]{0,254}$)"
      value: "str"
