name: Honcho
version: "3.0.26"
slug: honcho
description: "Open-source memory & user-state backend for AI agents. Embeds Postgres+pgvector and Redis — zero external dependencies."
url: "https://github.com/mliradelc/honcho-ha-addon"
image: ghcr.io/mliradelc/honcho-ha-addon
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 49170
panel_icon: mdi:memory
panel_title: Honcho
map:
  - addon_config:rw
ports:
  8000/tcp: null
ports_description:
  8000/tcp: "HTTP API for Honcho"
options:
  git_url: "https://github.com/mliradelc/honcho-1.git"
  git_ref: ""
  git_token: ""
  auto_update: false
  db_mode: embedded
  db_url: ""
  redis_mode: embedded
  redis_url: ""
  api_port: 8000
  access_password: ""
  # LLM configuration (Deriver — memory extraction from conversations)
  llm_transport: "openai"
  llm_model: ""
  llm_base_url: ""
  llm_api_key: ""
  # Embedding configuration
  embedding_transport: "openai"
  embedding_model: ""
  embedding_base_url: ""
  embedding_api_key: ""
  # OpenConcho web UI (served at the HA ingress alongside the Honcho API)
  openconcho_enabled: true
  env_vars: []
schema:
  git_url: "url?"
  git_ref: "str?"
  git_token: "password?"
  auto_update: "bool"
  db_mode: "str?"
  db_url: "str?"
  redis_mode: "str?"
  redis_url: "str?"
  api_port: "int?"
  access_password: "password?"
  llm_transport: "str?"
  llm_model: "str?"
  llm_base_url: "str?"
  llm_api_key: "password?"
  embedding_transport: "str?"
  embedding_model: "str?"
  embedding_base_url: "str?"
  embedding_api_key: "password?"
  openconcho_enabled: "bool"
  env_vars:
    - name: "match(^[A-Z_][A-Z0-9_]{0,254}$)"
      value: "str"
